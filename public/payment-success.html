<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Successful — AdvoCal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #eef0fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    /* ─── Outer shell (matches the rounded frame in screenshot) ─── */
    .shell {
      background: #f5f6fe;
      border-radius: 32px;
      padding: 14px 14px 20px;
      max-width: 390px;
      width: 100%;
      box-shadow: 0 2px 32px rgba(46, 91, 255, 0.07);
    }

    /* ─── White card ─── */
    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 44px 28px 36px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ─── Checkmark with pulse rings ─── */
    .check-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pulse ring 1 */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid #86efac;
      opacity: 0;
      animation: pulse-ring 2.4s ease-out infinite;
    }
    .ring-1 { width: 100px; height: 100px; animation-delay: 0s; }
    .ring-2 { width: 100px; height: 100px; animation-delay: 0.6s; }
    .ring-3 { width: 100px; height: 100px; animation-delay: 1.2s; }

    @keyframes pulse-ring {
      0%   { transform: scale(0.72); opacity: 0.8; }
      80%  { transform: scale(1.55); opacity: 0; }
      100% { transform: scale(1.55); opacity: 0; }
    }

    /* Inner tonal circle */
    .check-circle {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #f0fdf4;
      border: 2px solid #bbf7d0;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes pop-in {
      0%   { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* SVG tick — drawn on with stroke-dasharray animation */
    .check-circle svg {
      width: 34px;
      height: 34px;
      overflow: visible;
    }

    .tick-path {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: draw-tick 0.45s ease-out 0.3s forwards;
    }

    @keyframes draw-tick {
      to { stroke-dashoffset: 0; }
    }

    /* ─── Title ─── */
    h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.22;
      color: #141b2b;
      margin-bottom: 14px;
      letter-spacing: -0.015em;
    }

    /* ─── Subtitle ─── */
    .subtitle {
      font-size: 14px;
      font-weight: 600;
      color: #535f58;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .subtitle .brand {
      color: #2e5bff;
      font-weight: 700;
    }

    /* ─── Premium Active badge ─── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1.5px solid #1da34d;
      border-radius: 9999px;
      padding: 7px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #006b2d;
      letter-spacing: 0.01em;
      margin-bottom: 28px;
    }

    /* ─── Return To App button ─── */
    .btn-return {
      display: block;
      width: 100%;
      padding: 16px 24px;
      border-radius: 9999px;
      background: #1a3c28;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: none;
      letter-spacing: 0.01em;
      transition: background 0.15s, transform 0.1s;
      margin-bottom: 16px;
    }

    .btn-return:hover  { background: #0f2418; }
    .btn-return:active { transform: scale(0.97); }

    /* ─── Payment ID strip (partially shown at bottom like in screenshot) ─── */
    .pid-strip {
      background: #e9edff;
      border-radius: 12px;
      padding: 11px 16px;
      width: 100%;
      text-align: left;
      display: none;
    }

    .pid-strip-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #6e7a9f;
      margin-bottom: 3px;
    }

    .pid-strip-value {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #141b2b;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">

      <!-- Animated checkmark with pulse rings -->
      <div class="check-wrapper">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="check-circle">
          <svg viewBox="0 0 24 24" fill="none">
            <path class="tick-path"
              d="M6 12l4 4 8-8"
              stroke="#1da34d"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>

      <!-- Title -->
      <h1>Payment<br/>Successful!</h1>

      <!-- Subtitle -->
      <p class="subtitle">
        Your <span class="brand">AdvoCal Premium</span><br/>
        subscription has been activated<br/>
        successfully.
      </p>

      <!-- Premium Active badge -->
      <div class="badge">Premium Active</div>

      <!-- Return To App button -->
      <a class="btn-return" id="btn-return" href="advocal://payment-success">
        Return To App
      </a>

      <!-- Payment ID strip (visible when payment_id present) -->
      <div class="pid-strip" id="pid-strip">
        <div class="pid-strip-label">Payment ID</div>
        <div class="pid-strip-value" id="pid-strip-value">—</div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      var params  = new URLSearchParams(window.location.search);
      var pid     = params.get('payment_id');
      var btn     = document.getElementById('btn-return');
      var strip   = document.getElementById('pid-strip');
      var stripV  = document.getElementById('pid-strip-value');

      if (pid) {
        stripV.textContent   = pid;
        strip.style.display  = 'block';
        var deepLink = 'advocal://payment-success?payment_id=' + encodeURIComponent(pid) + '&activated=true';
        var ua = navigator.userAgent || '';
        if (/Android/.test(ua)) {
          btn.href = 'intent://payment-success?payment_id=' + encodeURIComponent(pid)
            + '&activated=true#Intent;scheme=advocal;package=host.exp.exponent;'
            + 'S.browser_fallback_url=https%3A%2F%2Fadvocal.web.app%2Fpayment-success;end';
        } else {
          btn.href = deepLink;
        }
      }
    })();
  </script>
</body>
</html>
