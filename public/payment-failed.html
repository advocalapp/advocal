<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Failed — AdvoCal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #eef0fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    /* ── Outer shell (matches success screen shell) ── */
    .shell {
      background: #f5f6fe;
      border-radius: 32px;
      padding: 14px 14px 20px;
      max-width: 390px;
      width: 100%;
      box-shadow: 0 2px 32px rgba(46, 91, 255, 0.07);
    }

    /* ── White card ── */
    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 48px 28px 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Double-ring error icon ── */
    .icon-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer pale-pink ring */
    .icon-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #ffe4e4;
      animation: pop-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* Shake animation on the whole icon */
    .icon-wrapper {
      animation: pop-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both,
                 shake 0.55s ease-in-out 0.5s both;
    }

    @keyframes shake {
      0%   { transform: translateX(0); }
      15%  { transform: translateX(-8px); }
      30%  { transform: translateX(8px); }
      45%  { transform: translateX(-6px); }
      60%  { transform: translateX(6px); }
      75%  { transform: translateX(-3px); }
      90%  { transform: translateX(3px); }
      100% { transform: translateX(0); }
    }

    @keyframes pop-in {
      0%   { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Inner solid dark-red circle */
    .icon-inner {
      position: relative;
      z-index: 1;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #c0392b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Exclamation bar */
    .excl-bar {
      width: 4px;
      height: 20px;
      border-radius: 2px;
      background: #ffffff;
    }

    /* Exclamation dot */
    .excl-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffffff;
    }

    /* ── Title ── */
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #141b2b;
      line-height: 1.22;
      margin-bottom: 20px;
      letter-spacing: -0.015em;
    }

    /* ── Body message ── */
    .message {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      line-height: 1.7;
      text-align: center;
      margin-bottom: 40px;
      padding: 0 4px;
    }

    /* ── Optional technical reason ── */
    #reason {
      font-size: 12px;
      font-weight: 600;
      color: #ef4444;
      font-style: italic;
      margin-top: -24px;
      margin-bottom: 28px;
      text-align: center;
    }

    /* ── Back to Home button — dark forest green (matches reference image) ── */
    .btn-home {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px 24px;
      border-radius: 16px;
      background: #1a6b3c;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      border: none;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-home:hover  { background: #145530; }
    .btn-home:active { transform: scale(0.97); }

    /* house icon SVG inside button */
    .btn-home svg {
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">

      <!-- Double-ring error icon with shake animation -->
      <div class="icon-wrapper">
        <div class="icon-outer"></div>
        <div class="icon-inner">
          <div class="excl-bar"></div>
          <div class="excl-dot"></div>
        </div>
      </div>

      <!-- Title -->
      <h1>Payment Failed</h1>

      <!-- Body text -->
      <p class="message">
        Something went wrong with your transaction.<br />
        Please check your payment details and try again.
      </p>

      <!-- Optional technical reason (shown only when ?reason= param present) -->
      <p id="reason"></p>

      <!-- Back to Home button — returns user to app payment screen -->
      <a class="btn-home" id="btn-home" href="advocal://payment">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/>
          <polyline points="9 21 9 12 15 12 15 21"/>
        </svg>
        Back to Home
      </a>

    </div>
  </div>

  <script>
    (function () {
      try {
        var params  = new URLSearchParams(window.location.search);
        var reason  = params.get('reason') || params.get('desc');
        var reasonEl = document.getElementById('reason');
        var btn      = document.getElementById('btn-home');

        if (reason) {
          reasonEl.textContent = 'Reason: ' + decodeURIComponent(reason);
        }

        // Deep-link back to app payment screen
        var ua = navigator.userAgent || '';
        if (/Android/.test(ua)) {
          btn.href = 'intent://payment#Intent;scheme=advocal;package=host.exp.exponent;'
            + 'S.browser_fallback_url=https%3A%2F%2Fadvocal.web.app%2Fpayment-failed;end';
        }
        // iOS uses the default advocal://payment href
      } catch (e) { /* ignore */ }
    })();
  </script>
</body>
</html>
